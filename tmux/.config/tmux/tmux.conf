# ================================================================
# tmux 配置
# ================================================================
# 前缀键: Alt+a         重载: Alt+a + r
# 插件: TPM 管理, 快捷键速查见下方
#
# ─── 速查表 (Quick Reference) ───────────────────────────────────
#   Alt+a            前缀键
#   Alt+a + r        重载配置            Alt+a + c  新建窗口
#   Alt+a + %/"(已解) F9 / F10          分屏(左/下)
#   Alt+a + h/j/k/l  切换面板            Alt+a + Ctrl+h/j/k/l 调大小
#   Alt+a + [        进入复制模式         Alt+a + p  悬浮 scratchpad
#   Alt+h / Alt+l    切换窗口            Alt+s      切换会话列表
#   鼠标右键         粘贴                拖选自动复制
# ================================================================

# ================================================================
# A. 基础设置 (General)
# ================================================================

# ── A.1 鼠标 ─────────────────────────────────────────────────────
# 点击切换面板、调整大小、滚轮翻页
set -g mouse on

# ── A.2 终端与颜色 ───────────────────────────────────────────────
# 内部 TERM 固定 tmux-256color (macOS 系统 terminfo 一定存在, 子进程不报错)
set -g default-terminal "tmux-256color"
# 强制所有外层终端开启真彩色, 保证状态栏颜色与 fish/应用一致
set -as terminal-features ',*:RGB'
# 开启下划线样式与颜色转发, 修复 Neovim guisp=#00ffff 下划线颜色被吞的问题
set -as terminal-features ',*:usstyle'

# ── A.3 窗口与面板 ──────────────────────────────────────────────
# 编号从 1 开始 (默认从 0, 键盘上太远)
set -g base-index 1
set -g pane-base-index 1
# 关闭窗口后自动重新编号
set -g renumber-windows on
# 关闭最后一个窗口时不销毁会话 (配合 scratchpad 悬浮窗, 防手滑误关)
set -g detach-on-destroy off

# ── A.4 滚动历史 ────────────────────────────────────────────────
set -g history-limit 50000

# ── A.5 输入响应 ────────────────────────────────────────────────
# 移除按 Esc 的延迟 (提升 Vim 体验)
set -s escape-time 0
# 焦点事件: 离开/回到面板时通知终端与 Vim 即时刷新
set -g focus-events on
# 命令提示符 (Alt+a + :) 使用 vi 编辑键位, 与复制模式一致
set -g status-keys vi

# ── A.6 标题与边框 ──────────────────────────────────────────────
# 终端标签页标题显示 会话:窗口
set -g set-titles on
set -g set-titles-string "#S:#W"
# 面板边框: 当前面板高亮, 其余淡化
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ================================================================
# B. 默认 Shell (fish)
# ================================================================
# 仅对之后新建的面板/窗口生效
# 用 if-shell 判断 fish 是否可用: 跨机 ssh 到无 fish 的远端时回退到登录 shell
if-shell -b "command -v fish >/dev/null 2>&1" 'set -g default-command "fish"'

# ================================================================
# C. 快捷键 (Key Bindings)
# ================================================================

# ── C.1 前缀键 ──────────────────────────────────────────────────
# 将默认前缀 Ctrl+b 改为 Alt+a
unbind C-b
set -g prefix M-a
bind M-a send-prefix
# macOS 优化: 缩短连击等待时间; 按一次 Alt+a 再按 Ctrl+a 可穿透给系统/Vim
set -g repeat-time 200
bind -r C-a send-prefix

# ── C.2 窗口与面板创建 ──────────────────────────────────────────
# 新建窗口 (继承当前目录)
bind c new-window -c "#{pane_current_path}"
# 分屏 (免前缀, 直接按 F9 / F10)
unbind %
unbind '"'
bind -n F8  split-window -h -c "#{pane_current_path}"
bind -n F9 split-window -v -c "#{pane_current_path}"
bind -n F10 resize-pane -Z

# ── C.3 面板导航 (Vim 风格, Prefix + h/j/k/l) ───────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── C.4 调整面板大小 (Prefix + Ctrl + h/j/k/l) ─────────────────
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# ── C.5 配置重载 (Prefix + r) ───────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ── C.6 悬浮窗 (Prefix + p) ─────────────────────────────────────
# 呼出一个后台持久运行的 scratchpad 会话弹窗 (不会丢失进度)
bind p display-popup -w 85% -h 85% -xC -yC -E "tmux attach-session -t scratchpad || tmux new-session -s scratchpad"

# ── C.7 免前缀快捷操作 ─────────────────────────────────────────
# 切换窗口 (Alt + h / l)
# 注意: 免前缀绑定会吞掉应用内的 Alt+h/l 按键 (如 Vim/htop)
bind -n M-h previous-window
bind -n M-l next-window
# 切换会话 (Alt + s 弹会话列表, -Z 切过去后自动缩放面板)
# 注意: 同样会吞掉应用内的 Alt+s
bind -n M-s choose-tree -Zs

# ================================================================
# D. 状态栏 (极简 + 竖条高亮: VS Code 式彩色指示条)
# ================================================================

# ── D.1 刷新与位置 ──────────────────────────────────────────────
set -g status-position top
set -g status-interval 60
set -g status-justify left
set -g bell-action none
set -g visual-bell on

# ── D.2 窗口标题 ────────────────────────────────────────────────
# 窗口名自动显示「文件夹名/进程名」(如 project/nvim)
set -g automatic-rename on
# set -g automatic-rename-format "#{b:pane_current_path}/#{pane_current_command}"
set -g automatic-rename-format "#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}/#{pane_current_command}"
set -g monitor-activity on

# ── D.3 外观样式 ────────────────────────────────────────────────
# 状态栏无底色 → 继承终端背景 (开透明即透明), 文字用 Catppuccin Mocha
set -g status-style "bg=default,fg=#afafaf"
set -g window-status-separator " "

# ── D.4 状态栏三段 ──────────────────────────────────────────────
# 左侧: 会话名, 前置蓝色竖条
set -g status-left "#[fg=#89dceb]▎#[fg=#afafaf,bold] #S #[default] "
set -g status-left-length 30

# 窗口列表: 当前=绿条+蓝底 / 活动=黄字 / 其余=灰色弱化
# 覆盖默认的 reverse(反色)活动样式, 否则黄色文字会被反转成黄色背景
setw -g window-status-activity-style "fg=default,bg=default"
# setw -g window-status-current-format "#[fg=#a6e3a1]▎#[fg=#cdd6f4,bold] #I:#W #[default]"
setw -g window-status-current-format "#[fg=#a6e3a1,bg=default]▎#[fg=#11111b,bg=#89dceb,bold] #I:#W #[default]"
setw -g window-status-format "#[fg=#afafaf]▎#[fg=#{?window_activity_flag,#f9e2af,#afafaf},bg=default] #I:#W #[default]"

# 右侧: 前缀高亮 + 电池(图标+百分比, 低电量变色) + 时间
set -g status-right "#{prefix_highlight}#[bg=default,fg=#afafaf] #{battery_color_charge_fg}#{battery_icon} #{battery_percentage}#[bg=default,fg=#afafaf] %H:%M"
set -g status-right-length 60

# ── D.5 电池显示配置 (tmux-battery) ─────────────────────────────
# Nerd Font 电池图标 (按电量分 8 档)
set -g @batt_icon_charge_tier8 '󰂂'
set -g @batt_icon_charge_tier7 '󰂁'
set -g @batt_icon_charge_tier6 '󰁿'
set -g @batt_icon_charge_tier5 '󰁾'
set -g @batt_icon_charge_tier4 '󰁽'
set -g @batt_icon_charge_tier3 '󰁼'
set -g @batt_icon_charge_tier2 '󰁻'
set -g @batt_icon_charge_tier1 '󰁺'
# 状态图标 (充满/充电/插电/未知)
set -g @batt_icon_status_charged '󰂅'
set -g @batt_icon_status_charging ''
set -g @batt_icon_status_attached ''
set -g @batt_icon_status_unknown ''
# 颜色: 前景随电量变色, 背景保持透明(default)
set -g @batt_color_charge_secondary_tier8 'default'
set -g @batt_color_charge_secondary_tier7 'default'
set -g @batt_color_charge_secondary_tier6 'default'
set -g @batt_color_charge_secondary_tier5 'default'
set -g @batt_color_charge_secondary_tier4 'default'
set -g @batt_color_charge_secondary_tier3 'default'
set -g @batt_color_charge_secondary_tier2 'default'
set -g @batt_color_charge_secondary_tier1 'default'

# ================================================================
# E. 复制粘贴与系统剪贴板 (Copy & Clipboard)
# ================================================================

# 复制模式使用 Vi 键位 (不加这行, v/y 会失效)
setw -g mode-keys vi

# ── E.1 选择 ────────────────────────────────────────────────────
# 进入复制模式后 (Ctrl+a + [), v 开始选择, V 整行选择
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line

# ── E.2 复制到系统剪贴板 ────────────────────────────────────────
# 适配 macOS (pbcopy) / Linux X11 (xclip) / Wayland (wl-copy)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy || xclip -selection clipboard || wl-copy"
# 鼠标拖选松开后自动复制 (保持选择状态, 需 Esc 退出)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy || xclip -selection clipboard || wl-copy"

# ── E.3 右键粘贴 (读取系统剪贴板, 适配 macOS/Linux) ─────────────
unbind -n MouseDown3Pane
bind-key -n MouseDown3Pane run-shell "(pbpaste || xclip -selection clipboard -o || wl-paste) | tmux load-buffer - && tmux paste-buffer"
# 若处于复制模式: 先退出再粘贴
bind-key -T copy-mode-vi MouseDown3Pane send-keys -X cancel \; run-shell "(pbpaste || xclip -selection clipboard -o || wl-paste) | tmux load-buffer - && tmux paste-buffer"

# ================================================================
# F. 插件管理 (TPM)
# ================================================================

# ── F.1 插件路径 ────────────────────────────────────────────────
# git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# Ctrl+a 再按 I(shift+i) 自动安装插件
# 显式固化安装路径, 防止重启后回落到默认路径
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

# ── F.2 插件列表 ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-battery'

# ── F.3 插件配置 ────────────────────────────────────────────────
# prefix-highlight: 按下前缀时状态栏高亮提示 (Catppuccin 配色)
# (显示样式见 D.4, 变量在此定义)
set -g @prefix_highlight_fg '#11111b'
set -g @prefix_highlight_bg '#f9e2af'

# resurrect: 保存时会话文件保留天数
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'

# continuum: 每 5 分钟自动保存, 启动时自动恢复上次会话
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# ================================================================
# G. 初始化 (TPM, 必须放在最后一行)
# ================================================================
run '~/.config/tmux/plugins/tpm/tpm'
