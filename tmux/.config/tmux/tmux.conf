# ==========================================
# tmux 配置文件
# 前缀键: Ctrl+a   |   重载: Ctrl+a + r
# ==========================================
#
# 目录
#   1. 基础设置 (General)
#   2. 默认 Shell (fish)
#   3. 快捷键 (Key Bindings)
#   4. 状态栏 (Zellij 风格)
#   5. 复制粘贴与系统剪贴板 (Copy & Clipboard)

# ==========================================
# 1. 基础设置 (General)
# ==========================================

# 鼠标支持 (点击切换面板、调整大小、滚轮翻页)
set -g mouse on

# 256 色 + 真色彩 (解决 Vim 颜色失真)
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",xterm-256color:Tc"

# 窗口和面板编号从 1 开始 (默认从 0，键盘上太远)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on   # 关闭窗口后自动重新编号

# 滚动历史行数 (默认 2000 不够看)
set -g history-limit 50000

# 移除按 Esc 的延迟 (提升 Vim 体验)
set -s escape-time 0

# 焦点事件: 离开/回到面板时通知终端与 Vim 即时刷新
set -g focus-events on

# 终端标签页标题显示 会话:窗口
set -g set-titles on
set -g set-titles-string "#S:#W"

# 面板边框: 当前面板高亮, 其余淡化
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ==========================================
# 2. 默认 Shell (fish)
# ==========================================
# 仅对之后新建的面板/窗口生效 (通过 PATH 解析, 跨 macOS/Linux)
set -g default-command "fish"

# ==========================================
# 3. 快捷键 (Key Bindings)
# ==========================================

# --- 3.1 前缀键 ---
# 将默认前缀 Ctrl+b 改为 Ctrl+a
unbind C-b
set -g prefix C-a

# macOS 优化: 缩短连击等待时间，并允许连按两次 Ctrl+a 穿透给系统/Vim
set -g repeat-time 200
bind -r C-a send-prefix

# --- 3.2 窗口与面板 (Prefix + 键 / 免前缀) ---
# 新建窗口 (继承当前目录)
bind c new-window -c "#{pane_current_path}"

# 分屏 (免前缀，直接按 F9 / F10)
unbind %
unbind '"'
bind -n F9  split-window -h -c "#{pane_current_path}"
bind -n F10 split-window -v -c "#{pane_current_path}"

# --- 3.3 面板导航 (Vim 风格, Prefix + h/j/k/l) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 3.4 调整面板大小 (Prefix + Ctrl + h/j/k/l) ---
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# --- 3.5 重载配置 (Prefix + r) ---
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# --- 3.6 悬浮窗 (Prefix + p) ---
# 呼出一个后台持久运行的 scratchpad 会话弹窗 (不会丢失进度)
bind p display-popup -w 85% -h 85% -xC -yC -E "tmux attach-session -t scratchpad || tmux new-session -s scratchpad"

# --- 3.7 免前缀切换窗口 (Alt + h / l) ---
bind -n M-h previous-window
bind -n M-l next-window

# ==========================================
# 4. 状态栏 (极简 + 竖条高亮: VS Code 式彩色指示条)
# ==========================================

# 位置与刷新
set -g status-position top
set -g status-interval 60
set -g status-justify left

# 窗口名自动显示当前目录的文件夹名
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}/#{pane_current_command}"
set -g monitor-activity on

# 状态栏无底色 → 继承终端背景 (开透明即透明), 文字用 Catppuccin Mocha
set -g status-style "bg=default,fg=#cdd6f4"
set -g window-status-separator " "

# 左: 会话名, 前置蓝色竖条
set -g status-left "#[fg=#89b4fa]▎#[fg=#cdd6f4,bold] #S #[default] "
set -g status-left-length 30

# 窗口: 当前=绿色竖条+bold / 上一=蓝紫条 / 其余=灰色弱化
# 覆盖默认的 reverse(反色)活动样式, 否则黄色文字会被反转成黄色背景
setw -g window-status-activity-style "fg=default,bg=default"
setw -g window-status-current-format "#[fg=#a6e3a1]▎#[fg=#cdd6f4,bold] #I:#W #[default]"
setw -g window-status-format "#[fg=#6c7086]▎#[fg=#{?window_activity_flag,#f9e2af,#6c7086},bg=default] #I:#W #[default]"

# 右侧: 时间
set -g status-right "#[bg=default,fg=#cdd6f4]  #(command -v pmset >/dev/null 2>&1 && pmset -g batt | awk 'NR==2{print $3}' | tr -d ';' || (command -v acpi >/dev/null 2>&1 && acpi -b | awk '{print $4}' | tr -d ',' | tail -1)) %H:%M "
set -g status-right-length 50


# ==========================================
# 5. 复制粘贴与系统剪贴板 (Copy & Clipboard)
# ==========================================

# 复制模式使用 Vi 键位 (不加这行, v/y 会失效)
setw -g mode-keys vi

# --- 选择 ---
# 进入复制模式后 (Ctrl+a + [), v 开始选择, V 整行选择
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line

# --- 复制到系统剪贴板 ---
# 适配 macOS (pbcopy) / Linux X11 (xclip) / Wayland (wl-copy)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy || xclip -selection clipboard || wl-copy"

# 鼠标拖选松开后自动复制 (保持选择状态, 需 Esc 退出)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy || xclip -selection clipboard || wl-copy"

# --- 右键粘贴 (读取系统剪贴板, 适配 macOS/Linux) ---
unbind -n MouseDown3Pane
bind-key -n MouseDown3Pane run-shell "(pbpaste || xclip -selection clipboard -o || wl-paste) | tmux load-buffer - && tmux paste-buffer"
# 若处于复制模式: 先退出再粘贴
bind-key -T copy-mode-vi MouseDown3Pane send-keys -X cancel \; run-shell "(pbpaste || xclip -selection clipboard -o || wl-paste) | tmux load-buffer - && tmux paste-buffer"
