# vim:fileencoding=utf-8
# ============================================================================
# 官方文档: https://sw.kovidgoyal.net/kitty/conf/
# 注意: kitty 不支持行尾注释, 注释必须独占整行
# 未写出的选项全部使用 kitty 内置默认值, 文档默认快捷键依然有效
# ============================================================================

# ============================================================================
# 1. 字体 (Fonts)
# ============================================================================

font_size              18.0
# macOS 上给字体加粗, 小字号时更清晰
macos_thicken_font     0.2
# 行高 110% 让行间略宽松
adjust_line_height     115%
# 列宽保持 0
adjust_column_width    0%

# 使用 kitten choose-fonts 生成的字体块, 保留标记以便后续修改
# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# ============================================================================
# 2. 光标 (Text Cursor)
# ============================================================================

cursor_shape            beam
cursor_beam_thickness   2.0
# 负数 = 跟随系统
cursor_blink_interval   -1
# 失焦时变空心
cursor_shape_unfocused  hollow
# 光标移动残影
cursor_trail            5

# ============================================================================
# 3. 滚动与历史 (Scrollback)
# ============================================================================

scrollback_lines              100000
# 分页查看时额外内存 (MB)
scrollback_pager_history_size 5
# 回滚时才显示滚动条
scrollbar                     scrolled
wheel_scroll_multiplier       5.0

# ============================================================================
# 4. 鼠标 (Mouse)
# ============================================================================

url_style               straight
url_color               #5B84FF
# 选中即复制
copy_on_select          yes
# 右键: 未选中时粘贴
mouse_map right press ungrabbed paste_from_clipboard
# 右键: 程序抓取鼠标时复制
mouse_map right press grabbed copy_to_clipboard

# ============================================================================
# 5. 性能 (Performance Tuning)
# ============================================================================

repaint_delay   10
input_delay     3
sync_to_monitor yes

# ============================================================================
# 6. 终端铃声 (Terminal Bell)
# ============================================================================

# 后台响铃时 tab 显示图标
bell_on_tab             " "
# 关闭闪屏
visual_bell_duration    0.0
window_alert_on_bell    yes
# 关闭音频铃声 (点击 tmux 标签切换时不再响)
enable_audio_bell       no

# ============================================================================
# 7. 窗口 (Window Layout & Appearance)
# ============================================================================

remember_window_size     yes
remember_window_position yes
placement_strategy       center
initial_window_width     110c
initial_window_height    30c

window_margin_width      1
window_padding_width     1
single_window_margin_width -10

background_opacity       0.8
background_blur          50
hide_window_decorations  titlebar-only
draw_minimal_borders     no

macos_window_resizable   yes
macos_quit_when_last_window_closed yes

# 后台命令完成时通知
notify_on_cmd_finish     invisible 3.0 notify-bell
tab_activity_symbol      "●"
# 粘贴含控制码时确认
paste_actions            confirm
allow_remote_control     yes

# ============================================================================
# 8. Tab 栏 (Tab Bar) — 使用自绘 tab_bar.py
# ============================================================================

tab_bar_style           custom
tab_bar_edge            top
tab_bar_align           left
tab_bar_min_tabs        2
tab_switch_strategy     previous
tab_bar_margin_width    0.0
tab_bar_margin_height   5.0 0.0

tab_separator           " "
tab_bar_background      none
tab_fade                0 0 0 0
# 自定义标题模板 (只显示文件名, 兼容 / 与 \ 路径, 超长截断)
tab_title_template      "{fmt.bg.default}▎{index}: {title.replace('\\','/').rsplit('/',1)[-1][:25]}"
active_tab_title_template "{fmt.bg.default}{fmt.fg.green}▎{fmt.fg.black}{fmt.bg.cyan} {index}: {title.replace('\\','/').rsplit('/',1)[-1][:25]} "
active_tab_font_style   bold-italic
inactive_tab_font_style normal

# ============================================================================
# 9. 颜色方案 (Color Scheme) — kitten themes 生成的主题块
# ============================================================================

# BEGIN_KITTY_THEME
# 1984 Dark Theme
include current-theme.conf
# END_KITTY_THEME

# ============================================================================
# 10. 高级设置 (Advanced)
# ============================================================================

shell                   fish
editor                  nvim
shell_integration       enabled
force_ltr               yes
macos_option_as_alt     both
clipboard_control       write-clipboard write-primary read-clipboard-ask read-primary-ask
update_check_interval   24

# ============================================================================
# 11. 快捷键 (Keyboard Shortcuts)
#    kitty 内置大量默认快捷键依然生效, 这里只补充/覆盖常用项
#    完整默认列表见: https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts
# ============================================================================

# ---- 字体大小: 用 Cmd +/- 调整 (与多数 macOS 应用一致) ----
map cmd+equal       change_font_size all +2.0
map cmd+plus        change_font_size all +2.0
map cmd+minus       change_font_size all -2.0
map cmd+0           change_font_size all 0

# ---- 窗口 / 分屏 ----
map cmd+enter       new_window
# 新窗口继承当前目录
map cmd+shift+enter new_window --cwd=current
map kitty_mod+enter new_window
# 循环切换布局
map ctrl+shift+l         next_layout
# Cmd+D 关闭当前窗口
map cmd+d           close_window
# 关闭当前 Tab
map cmd+shift+d     close_tab
map cmd+n           new_os_window

# ---- 切换 Tab: Cmd+左右 (对齐浏览器习惯) ----
map cmd+left        previous_tab
map cmd+right       next_tab

# ---- 滚动 ----
map cmd+up          scroll_line_up
map cmd+down        scroll_line_down
# 在滚动缓冲中搜索
map cmd+f           search_scrollback
map kitty_mod+h     show_scrollback

# ---- 便捷动作 ----
map kitty_mod+f2    edit_config_file
map cmd+,           edit_config_file
map kitty_mod+f5    load_config_file
map ctrl+cmd+,      load_config_file
map kitty_mod+u     kitten unicode_input
map ctrl+cmd+space  kitten unicode_input
map kitty_mod+f11   toggle_fullscreen
map ctrl+cmd+f      toggle_fullscreen
map cmd+ctrl+l      clear_terminal to_cursor_scroll active

