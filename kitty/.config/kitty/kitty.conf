## ---------------- Kitty 配置 ----------------
# 终端: fish | 字体: JetBrainsMono Nerd Font Mono

## ---------------- 字体 ----------------

font_size              17.0
adjust_line_height     100%

# macOS 上给字体加粗, 小字号时更清晰
macos_thicken_font     0.2
# 使用 kitten choose-fonts 生成的字体块, 保留标记以便后续修改
# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
# END_KITTY_FONTS

## ---------------- 光标 ----------------

cursor_shape            beam
cursor_beam_thickness   2.0
# 光标移动残影
cursor_trail            5

## ---------------- 滚动 ----------------

scrollback_lines              100000
# 分页查看时额外内存 (MB)
scrollback_pager_history_size 5

## ---------------- 鼠标 ----------------

url_style               straight
url_color               #5B84FF
# 选中即复制
copy_on_select          yes
# 右键: 未选中时粘贴
mouse_map right press ungrabbed paste_from_clipboard

## ---------------- 铃声 ----------------

# 后台响铃时 tab 显示图标
bell_on_tab             " "
# 关闭音频铃声 (点击 tmux 标签切换时不再响)
enable_audio_bell       no

## ---------------- 窗口 ----------------

remember_window_position yes
initial_window_width     124c
initial_window_height    34c

window_margin_width      1
window_padding_width     1
single_window_margin_width -10

background_opacity       0.8
background_blur          50
hide_window_decorations  titlebar-only

macos_quit_when_last_window_closed yes

# 后台命令完成时通知
notify_on_cmd_finish     invisible 3.0 notify-bell
tab_activity_symbol      "●"
# 粘贴含控制码时确认
paste_actions            confirm
allow_remote_control     yes
# 远程控制 socket: 让 kitten 在 tmux 内也能直接与 kitty 通信
# 注意: 修改此项不支持热重载, 必须完整重启 kitty 才生效
listen_on                unix:kitty-{kitty_pid}

## ---------------- Tab 栏 ----------------
# 使用自绘 tab_bar.py

tab_bar_style           custom
tab_bar_edge            top
tab_bar_margin_height   5.0 0.0

tab_separator           " "
tab_fade                0 0 0 0
# 自定义标题模板 (只显示文件名, 兼容 / 与 \ 路径, 超长截断)
tab_title_template      "{fmt.bg.default}▎{index}: {title.replace('\\','/').rsplit('/',1)[-1][:25]}"
active_tab_title_template "{fmt.bg.default}{fmt.fg.green}▎{fmt.fg.black}{fmt.bg.cyan} {index}: {title.replace('\\','/').rsplit('/',1)[-1][:25]} "

## ---------------- 配色 ----------------
# 由 kitten themes 生成的主题块

# BEGIN_KITTY_THEME
# 1984 Dark Theme
include current-theme.conf
# END_KITTY_THEME

## ---------------- 高级设置 ----------------

shell                   fish
editor                  nvim
force_ltr               yes
macos_option_as_alt     both

## ---------------- 快捷键 ----------------

# ---- 窗口 / 分屏 ----
# 新建标签页 (继承当前目录)
map cmd+t           new_tab_with_cwd
# 循环切换布局
map ctrl+shift+l         next_layout
