# ============================================================
# Alacritty 配置
# 终端: fish | 字体: JetBrainsMono Nerd Font
# 配色: Tokyo Night | 窗口: 半透明 + 模糊
# ============================================================

# ============================================================
# 字体（必须 Nerd Font）
# ============================================================

[font]
size = 19.0

# 常规 / 粗体 / 斜体
[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.offset]
x = 0
y = 0

# ============================================================
# 窗口
# ============================================================

[window]
opacity = 0.95
blur = true
option_as_alt = "Both"

# 内边距（留白更美观）
dynamic_padding = true
padding = { x = 5, y = 5 }

# 无标题栏（Buttonless 仅 macOS，Full 跨平台）
decorations = "Buttonless"

# 启动方式与默认尺寸/位置
startup_mode = "Maximized"

# ============================================================
# 配色 — Tokyo Night
# ============================================================

# 前景 / 背景
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"
dim_foreground = "#565f89"

# 光标
[colors.cursor]
text = "#1a1b26"
cursor = "#c0caf5"

# 常规色
[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

# 亮色
[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

# ============================================================
# 光标
# ============================================================

[cursor]
style = { shape = "Beam", blinking = "Always" }
blink_interval = 950
blink_timeout = 0
unfocused_hollow = false
thickness = 0.25

# ============================================================
# 滚动
# ============================================================

[scrolling]
history = 10000

# ============================================================
# 选择
# ============================================================

# 选中后自动存入系统剪贴板
[selection]
save_to_clipboard = true

# ============================================================
# 鼠标
# ============================================================

[mouse]
hide_when_typing = true

# 鼠标操作
[[mouse.bindings]]
mouse = "Left"
mods = "Shift"
action = "Copy"

[[mouse.bindings]]
mouse = "Right"
action = "Paste"

# ============================================================
# 键盘绑定
# ============================================================

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

## ---------------- tmux 兼容性建议 ----------------
# alacritty terminfo，tmux/nvim 色彩正常
[env]
TERM = "alacritty"
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"
