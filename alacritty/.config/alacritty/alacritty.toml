# ============================================================
# Alacritty 配置
# 终端: fish | 字体: JetBrainsMono Nerd Font
# 配色: Molokai | 窗口: 半透明 + 模糊
# ============================================================

# ============================================================
# 窗口
# ============================================================
[window]
opacity = 0.95
blur = true
option_as_alt = "Both"

# 内边距（留白更美观）
dynamic_padding = true
padding = { x = 5, y = 5 }

# 无标题栏（Buttonless 仅 macOS，Full 跨平台）
decorations = "Buttonless"

# 启动方式与默认尺寸/位置
startup_mode = "Maximized"

# ============================================================
# 光标
# ============================================================
[cursor]
style = { shape = "Beam", blinking = "Always" }
blink_interval = 950
blink_timeout = 0
unfocused_hollow = false
thickness = 0.35

# ============================================================
# 滚动
# ============================================================
[scrolling]
history = 10000

# ============================================================
# 字体（必须 Nerd Font）
# ============================================================
[font]
size = 19.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.offset]
x = 0
y = 1

# ============================================================
# 配色 — Molokai
# ============================================================

# 前景 / 背景
[colors.primary]
background = "#1a1b26"
foreground = "#f8f8f2"

# 光标
[colors.cursor]
text = "#1b1d1e"
cursor = "#89dceb"

# 常规色
[colors.normal]
black   = "#1b2436"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#f4d370"
blue    = "#7aa2f7"
magenta = "#ad8ee6"
cyan    = "#89dceb"
white   = "#e3e6ee"

# 亮色
[colors.bright]
black   = "#75715e"
red     = "#f92672"
green   = "#a6e22e"
yellow  = "#f4bf75"
blue    = "#66d9ef"
magenta = "#ae81ff"
cyan    = "#a1efe4"
white   = "#f9f8f5"

# ============================================================
# 选择 & 鼠标
# ============================================================

# 选中后自动存入系统剪贴板
[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# 鼠标操作
[[mouse.bindings]]
mouse = "Left"
mods = "Shift"
action = "Copy"

[[mouse.bindings]]
mouse = "Right"
action = "Paste"

# ============================================================
# 键盘绑定
# ============================================================

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"
