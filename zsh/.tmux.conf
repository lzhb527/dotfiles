# ==========================================
# 1. 基础全局设置 (General Settings)
# ==========================================
# 开启鼠标支持 (点击切换面板、调整大小、滚轮翻页)
set -g mouse on

# 开启 256 色和真色彩支持 (解决 Vim 颜色失真问题)
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:Tc"

# 窗口和面板编号从 1 开始计数 (默认从 0 开始，在键盘上太远)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on # 关闭窗口后自动重新编号

# 增大历史滚动行数限制 (默认 2000 行不够看)
set -g history-limit 50000

# 移除按 Esc 键的延迟 (极大提升 Vim 用户体验)
set -s escape-time 0

# 【核心修复】启用复制模式下的 Vi 键盘布局（不加这行，底部的 v 和 y 会全部失效）
set-w -g mode-keys vi

# ==========================================
# 2. 快捷键重绑定 (Key Bindings)
# ==========================================
# 将默认前缀键 Ctrl+b 改为 Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 💡 针对 macOS 优化：专门解决 Ctrl+A 与连击参数 (-r) 的卡死冲突
set -g repeat-time 200     # 将连击等待时间从默认的 500ms 缩短到 200ms（防止卡键）
bind -r C-a send-prefix    # 核心：允许连按两次 Ctrl+A 穿透给系统/Vim 使用

# 更加直观的分屏快捷键 (免前缀键：直接单按 F9 或 F10)
unbind %
unbind '"'
bind -n F9 split-window -h -c "#{pane_current_path}"
bind -n F10 split-window -v -c "#{pane_current_path}"

# 绑定 r 键为快速重新加载配置文件 (Prefix + r)
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 使用 Vim 风格的方向键切换面板 (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 调整面板大小 (Prefix + Ctrl + h/j/k/l)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# 悬浮窗口快捷键绑定 (Prefix + p) 
# 按 Ctrl + a 键再按 p 键：呼出一个后台持久运行的弹窗（不会丢失进度）
bind p display-popup -w 85% -h 85% -xC -yC -E "tmux attach-session -t scratchpad || tmux new-session -s scratchpad"

# ==========================================
# 3. 复刻 Zellij 风格：黑底独立徽章样式状态栏
# ==========================================
# 将状态栏移动到屏幕顶部 (默认在底部 bottom)
set -g status-position top
set -g status-interval 1
set -g status-justify left

# 自动将窗口名称设置为当前工作目录的文件夹名
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path}"

# 允许窗口标签之间留出空格（Zellij 风格的核心，拉开徽章间距）
set -g window-status-separator ""

# 全局状态栏背景设为深黑（确保和徽章两边的黑色完美融合）
set -g status-style "bg=#161616,fg=#cdd6f4"

# 最左侧会话标签 (蓝色徽章)
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold] ❐ #S #[fg=#89b4fa,bg=#11111b]"
set -g status-left-length 20

# 激活窗口样式 (绿色徽章)：前后包裹箭头，向两边的黑色背景淡出
setw -g window-status-current-format "#[fg=#11111b,bg=#a6e3a1]#[fg=#11111b,bg=#a6e3a1,bold]#I:#W#[fg=#a6e3a1,bg=#11111b]"

# 未激活窗口样式 (深灰徽章)：前后包裹箭头，同样向两边的黑色背景淡出
setw -g window-status-format "#[fg=#11111b,bg=#313244]#[fg=#cdd6f4,bg=#313244]#I:#W#[fg=#313244,bg=#11111b]"

# 右侧状态栏 (显示时间)
set -g status-right "#[fg=#45475a]#[bg=#45475a,fg=#cdd6f4]  %H:%M "
set -g status-right-length 50

# ==========================================
# 4. Vim 模式复制粘贴与跨平台系统剪贴板联动
# ==========================================
# 进入复制模式后 (Ctrl+a + [)，使用 v 开始选择
bind-key -T copy-mode-vi v send-keys -X begin-selection

# 使用 V 进行整行块选择
bind-key -T copy-mode-vi V send-keys -X select-line

# 【终极修复】使用 y 复制（同时通过管道优雅适配 macOS / Linux X11 / Linux Wayland 系统剪贴板）
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy || xclip -selection clipboard || wl-copy"

